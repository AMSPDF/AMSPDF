<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Resize - AMS PDF</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:white;
    padding:18px 6%;
    border-bottom:1px solid #e5e7eb;
}

.logo{
    font-size:27px;
    font-weight:800;
    color:#2563eb;
}

.container{
    max-width:850px;
    margin:40px auto;
    padding:20px;
}

.box{
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 5px 25px #00000010;
}

h1{
    text-align:center;
    margin-top:0;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

.upload{
    border:2px dashed #2563eb;
    padding:35px 20px;
    text-align:center;
    border-radius:14px;
    background:#f8fbff;
    cursor:pointer;
}

.upload input{
    display:none;
}

.upload strong{
    display:block;
    font-size:18px;
    margin-bottom:8px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:25px;
}

label{
    font-weight:bold;
}

select{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #d1d5db;
    border-radius:9px;
    background:white;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#2563eb
